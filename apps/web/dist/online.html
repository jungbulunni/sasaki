<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}</style>
</head><body><title>사사끼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@500;700;800&display=swap">
<style>
/* 확정 디자인 2026-11-05: 보라·겨자 대각선, 크림색 이름표, 겨자색 주패 받침, 왕관 쓴 분홍 돼지.
   레이아웃: 위·왼쪽·오른쪽 상대 자리와 가운데 더미, 아래 내 주패. 넓은 화면은 오른쪽에 진행 기록.
   한 가지 색 세계로 고정 (밝은/어두운 모드와 상관없이 같은 모습). */
:root {
  color-scheme: dark;
  --purple: #4B1F75;
  --purple-2: #5E2D8E;
  --ink: #2E1640;
  --mustard: #E2B33A;
  --mustard-2: #C9961F;
  --gold: #F5C83F;
  --cream: #FFF8E7;
  --card: #FFFDF6;
  --red: #D2343E;
  --pink: #F7A8BA;
  --lilac: #D9C8EC;
  --mute: #6B5A7A;
  --good: #2F8F5B;
  --shadow: rgba(20, 6, 32, .45);
  --font-display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --r: 14px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--purple); color: var(--cream); font: 500 15px/1.5 var(--font-body); }
body[data-screen="home"] { background: linear-gradient(162deg, var(--purple) 0 57%, var(--mustard) 57% 100%) fixed; }
#app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 24px; max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── 버튼 ── */
.btn { min-height: 48px; padding: 0 18px; border-radius: var(--r); border: 3px solid var(--purple); background: var(--cream); color: var(--purple); font: 400 19px var(--font-display); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
.btn.primary:disabled { box-shadow: none; opacity: 1; background: #9A82B4; color: #EEE6F6; border-color: #7C6596; }
.btn.gold:disabled { box-shadow: none; opacity: 1; background: #8F7A55; color: #E7DCC2; border-color: #6E5C3E; }
.me .btn:not(.primary):disabled { opacity: 1; background: transparent; color: rgba(46, 22, 64, .4); border-color: rgba(46, 22, 64, .3); }
.btn.primary { background: var(--purple); color: var(--gold); border-color: var(--ink); box-shadow: 0 5px 0 var(--ink); min-width: 120px; font-size: 22px; }
.btn.primary:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.btn.gold { background: var(--mustard); color: var(--purple); border-color: var(--ink); box-shadow: 0 5px 0 var(--ink); font-size: 22px; }
.btn.gold:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.btn.line { background: transparent; color: var(--gold); border-color: var(--gold); }
.btn.hot { background: var(--red); color: var(--cream); border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
.btn.spec { background: var(--pink); color: var(--ink); border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--purple); font: 800 14px var(--font-body); min-height: 40px; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 15px; border-width: 2px; }
.btn.big { font-size: 21px; padding: 0 20px; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--gold); background: transparent; display: grid; place-items: center; }
.iconbtn svg { width: 19px; height: 19px; fill: none; stroke: var(--gold); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ── 입력 ── */
.field { display: grid; gap: 6px; font-size: 13px; font-weight: 800; }
.input { height: 50px; border-radius: var(--r); border: 3px solid var(--purple); background: var(--cream); padding: 0 16px; font: 700 18px var(--font-body); color: var(--ink); min-width: 0; width: 100%; }

/* ── 시작 화면 ── */
.home { width: min(420px, 100%); margin: 0 auto; min-height: calc(100dvh - 40px); display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 18px; }
.home .hello { align-self: flex-start; margin: 0; font: 400 30px/1.18 var(--font-display); color: var(--gold); }
.pigbody { width: min(208px, 52vw); height: auto; }
.home .titlebox { flex: 1; min-height: 120px; align-self: stretch; margin: 0 -12px; display: flex; align-items: center; justify-content: center; }
.home .title { font: 400 clamp(96px, 32vw, 128px)/.95 var(--font-display); color: var(--pink); -webkit-text-stroke: 9px var(--purple); paint-order: stroke fill; text-shadow: 0 7px 0 var(--purple); letter-spacing: -.07em; white-space: nowrap; }
.home form { align-self: stretch; display: grid; gap: 10px; color: var(--purple); }
.home .joinrow { display: flex; gap: 8px; }
.home .joinrow .input { flex: 1; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; }
.home .invited { margin: 0; font-weight: 800; }
.home .invited b { font-family: var(--font-display); letter-spacing: .12em; }

/* ── 대기실 ── */
.lobby { width: min(440px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding-top: 10px; }
.logo { font: 400 28px/1 var(--font-display); color: var(--gold); }
.codebox { display: grid; justify-items: center; gap: 4px; padding: 18px 16px; border-radius: 22px; background: var(--mustard); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); color: var(--purple); }
.codebox .lbl { font-size: 13px; font-weight: 800; }
.codebox .code { font: 400 58px/1 var(--font-display); letter-spacing: .14em; padding-left: .14em; }
.invite { display: flex; gap: 8px; align-self: stretch; margin-top: 10px; }
.invite .input { height: 44px; font-size: 13px; border-width: 2px; }
.invite .btn { min-height: 44px; font-size: 16px; padding: 0 14px; white-space: nowrap; flex: none; background: var(--purple); color: var(--gold); border: 2px solid var(--ink); }
.lseats { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.lseat { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; border-radius: 16px; background: var(--cream); color: var(--ink); }
.lseat.empty { background: transparent; border: 2px dashed #9C7CC4; color: var(--lilac); }
.lnum { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--purple); color: var(--gold); display: grid; place-items: center; font: 400 16px var(--font-display); }
.lseat.empty .lnum { background: transparent; border: 2px solid #9C7CC4; color: var(--lilac); }
.lname { flex: 1; min-width: 0; font-size: 18px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lseat.empty .lname { font-size: 16px; font-weight: 700; }
.lseat .btn.small { border-color: var(--purple); }
.lseat .ai-add { background: var(--pink); border-color: var(--ink); color: var(--ink); }
.eggrow { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 16px; background: var(--purple-2); font-weight: 800; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper .iconbtn { font: 400 20px var(--font-display); color: var(--gold); }
.stepper .val { display: inline-flex; align-items: center; gap: 6px; font: 400 26px var(--font-display); color: var(--gold); min-width: 3.2ch; justify-content: center; }
.egg { width: 18px; height: 22px; }
.lobby .bar { display: flex; gap: 10px; }
.lobby .bar .gold { flex: 1; }
.lobby .waitnote { margin: 0; color: var(--lilac); font-weight: 700; text-align: center; }

/* ── 칩 ── */
.chip { font-style: normal; font: 800 11px/1 var(--font-body); padding: 4px 8px; border-radius: 999px; background: #E9DFF3; color: var(--purple); white-space: nowrap; }
.chip.turn { background: var(--purple); color: var(--gold); }
.chip.done { background: var(--good); color: #fff; }
.chip.warn { background: #FBE3C2; color: #8A4B0F; }
.chip.firechip { background: var(--red); color: var(--cream); }
.chip.aichip { background: var(--pink); color: var(--ink); }
.chip.host { background: var(--mustard); color: var(--purple); }
.chip.mychip { background: var(--purple); color: var(--cream); }
.lseat .chip { flex: none; }

/* ── 게임 머리 ── */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.meta > .pill { padding: 5px 11px; border-radius: 999px; background: var(--purple-2); font-size: 13px; font-weight: 800; }
.meta > .pill.hot { background: var(--red); }
.buried { display: inline-flex; align-items: center; gap: 2px; color: var(--gold); }
.buried .egg { width: 12px; height: 15px; margin-left: -5px; } .buried .egg:first-child { margin-left: 0; }
.buried em { font-style: normal; margin-left: 4px; }

/* ── 게임판 ── */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.tablearea { display: grid; gap: 14px; min-width: 0; }
.felt { position: relative; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr) minmax(0, 1fr); grid-template-areas: ". top ." "left pile right" ". bottom ."; padding: 14px 12px; border-radius: 26px; background: var(--purple-2); border: 4px solid var(--mustard); box-shadow: inset 0 0 0 4px var(--purple); }
.seat { display: grid; gap: 3px; justify-items: center; justify-content: center; text-align: center; padding: 8px 6px; border-radius: 16px; background: var(--cream); color: var(--ink); border: 3px solid var(--ink); min-width: 0; align-self: center; }
.seat.top { grid-area: top; justify-self: center; width: min(100%, 220px); }
.seat.bottom { grid-area: bottom; justify-self: center; width: min(100%, 220px); }
.seat.left { grid-area: left; } .seat.right { grid-area: right; }
.seat.active { background: var(--mustard); box-shadow: 0 0 0 3px var(--gold), 0 0 22px rgba(245, 200, 63, .55); }
.sname { display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 15px; font-weight: 800; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seggs { font-size: 12px; font-weight: 700; color: #7A5A1A; }
.seat.active .seggs { color: var(--purple); }
.backs { display: flex; justify-content: center; min-height: 19px; max-width: 100%; overflow: hidden; }
.back { width: 13px; height: 19px; border-radius: 3px; margin-left: -6px; background: var(--mustard) radial-gradient(circle at 50% 50%, var(--purple) 0 2px, transparent 2.5px); border: 1.5px solid var(--ink); }
.back:first-child { margin-left: 0; }
.seat.active .back { background-color: var(--cream); }
.badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }

.pile { grid-area: pile; min-height: 190px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 6px; min-width: 0; position: relative; z-index: 1; }
.pile-note { margin: 0; text-align: center; color: var(--lilac); font-weight: 700; } .pile-note b { color: var(--cream); }
.pilewrap { display: grid; gap: 10px; justify-items: center; }
.pilecards { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; }
.play { display: grid; gap: 5px; justify-items: center; opacity: .55; }
.play.last { opacity: 1; }
.play.special.last .pcards { filter: drop-shadow(0 0 12px rgba(247, 168, 186, .95)); }
.pcards { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.pby { font-size: 12px; font-weight: 700; color: var(--lilac); } .play.last .pby { color: var(--cream); font-size: 13px; font-weight: 800; }
.lead-note { margin: 0; font: 400 24px var(--font-display); color: var(--gold); display: inline-flex; align-items: center; gap: 6px; }
.lead-note.quiet { font: 700 13px var(--font-body); color: var(--lilac); }

/* ── 카드 ── */
.card { --w: 46px; width: var(--w); height: calc(var(--w) * 1.43); flex: none; display: inline-flex; flex-direction: column; justify-content: space-between; padding: 3px 5px; border-radius: 8px; background: var(--card); color: var(--ink); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font-family: var(--font-display); line-height: 1; transition: transform .12s ease; }
.card.red { color: var(--red); }
.card .rk { font-size: calc(var(--w) * .41); letter-spacing: -.03em; }
.card .st { font-size: calc(var(--w) * .43); align-self: flex-end; }
.card.small { --w: 32px; border-width: 2px; border-radius: 6px; padding: 2px 3px; box-shadow: 0 2px 0 var(--ink); }
button.card:hover { transform: translateY(-4px); }
.card.sel, button.card.sel:hover { transform: translateY(-14px); border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple), 0 6px 0 var(--ink); }

/* ── 내 주패 ── */
.me { display: grid; gap: 10px; padding: 16px 14px 18px; border-radius: 26px; background: var(--mustard); border: 4px solid var(--ink); color: var(--ink); min-width: 0; }
.me-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.me-name { display: inline-flex; align-items: center; gap: 6px; font: 400 20px var(--font-display); color: var(--purple); }
.me-name small { font: 700 13px var(--font-body); }
.status { font-size: 14px; font-weight: 800; color: var(--purple); }
.status.good { color: var(--purple); text-decoration: underline 3px var(--cream); text-underline-offset: 4px; }
.status.none { color: var(--red); }
.hand { display: flex; flex-wrap: wrap; gap: 5px; padding-top: 16px; min-height: 86px; }
.hand .card { --w: 50px; }
.me .pile-note { color: var(--purple); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions #playBtn { flex: 1 1 140px; min-height: 56px; }
.actions #passBtn { min-height: 56px; min-width: 100px; }
.actions .btn.ghost { color: var(--purple); }
.timed { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border-radius: 16px; background: rgba(46, 22, 64, .12); }

/* ── 가운데 선택 창 (달리기·뚝) ── */
.panel { display: grid; gap: 10px; justify-items: center; text-align: center; max-width: 440px; }
.ptitle { margin: 0; font: 400 30px var(--font-display); color: var(--gold); text-wrap: balance; }
.psub { margin: 0; color: var(--lilac); font-size: 13px; font-weight: 700; text-wrap: pretty; } .psub b { color: var(--cream); }
.prow { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

/* ── 타이머 ── */
.ring { flex: none; vertical-align: middle; transform: rotate(-90deg); }
.ring.xs { width: 16px; height: 16px; } .ring.sm { width: 22px; height: 22px; } .ring.md { width: 42px; height: 42px; }
.ring .bg { fill: none; stroke: rgba(46, 22, 64, .25); stroke-width: 6; }
.ring .fg { fill: none; stroke: var(--purple); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; animation: shrink linear forwards; }
.felt .ring .bg, .panel .ring .bg, .lead-note .ring .bg { stroke: rgba(255, 248, 231, .2); }
.panel .ring .fg, .lead-note .ring .fg { stroke: var(--gold); }
@keyframes shrink { to { stroke-dashoffset: 100; } }

/* ── 낼 수 있는 패가 없습니다 ── */
.nopass { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-radius: 16px; background: var(--purple); color: var(--gold); border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); animation: wobble .5s ease-in-out infinite alternate; }
.nopass-text b { font: 400 clamp(22px, 5.4vw, 30px)/1.1 var(--font-display); }
.clock { width: 50px; height: 50px; flex: none; }
.clock .face { fill: var(--cream); stroke: var(--ink); stroke-width: 2.5; }
.clock .sweep { fill: none; stroke: var(--red); stroke-width: 6; stroke-dasharray: 100; stroke-dashoffset: 100; transform: rotate(-90deg); transform-origin: 24px 24px; animation: sweep linear forwards; }
.clock .hand { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; transform-origin: 24px 24px; animation: tickhand steps(4, end) forwards; }
.clock .pin { fill: var(--ink); }
@keyframes sweep { to { stroke-dashoffset: 0; } }
@keyframes tickhand { to { transform: rotate(360deg); } }
@keyframes wobble { from { transform: rotate(-.8deg); } to { transform: rotate(.8deg); } }

/* ── 진행 기록 ── */
.log { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 40px); overflow: auto; padding: 12px 14px; border-radius: 18px; background: var(--purple-2); min-width: 0; }
.log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13px; }
.log li { color: var(--lilac); } .log li:first-child { color: var(--cream); font-weight: 700; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--lilac); }
details.log > summary { cursor: pointer; list-style: none; }
details.log > summary::-webkit-details-marker { display: none; }
details.log[open] > summary .eyebrow { margin-bottom: 8px; }
details.log > summary .eyebrow::after { content: " ▾"; }
details.log:not([open]) > summary .eyebrow::after { content: " ▸"; }

/* ── 판 결과 ── */
.overlay { position: fixed; inset: 0; z-index: 20; overflow: auto; background: linear-gradient(162deg, var(--mustard) 0 38%, var(--purple) 38% 100%); padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(440px, 100%); min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; color: var(--ink); }
.reshead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.reshead .eyebrow { color: var(--purple); letter-spacing: 0; font-size: 14px; }
.reshead h2 { margin: 2px 0 0; font: 400 clamp(34px, 10vw, 44px)/1.05 var(--font-display); color: var(--purple); white-space: nowrap; }
.reshead .pigface { width: 112px; height: auto; flex: none; }
.restable { display: grid; gap: 8px; padding: 14px 12px; border-radius: 22px; background: var(--cream); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); }
.rrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) 54px 50px 44px; align-items: center; gap: 6px; min-height: 50px; padding: 0 12px; border-radius: 14px; font-weight: 800; font-size: 15px; }
.rrow.head { min-height: 22px; font-size: 12px; font-weight: 700; color: #7A6A86; }
.rrow.first { background: #FDF0CF; }
.rrow.mine { background: var(--purple); color: var(--cream); }
.rrow .place { font: 400 18px var(--font-display); color: var(--mustard-2); }
.rrow.mine .place { color: var(--gold); }
.rrow .place.none { color: #9C8AAE; }
.rrow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow .nm small { font-size: 12px; color: var(--lilac); }
.team { justify-self: start; padding: 3px 7px; border-radius: 999px; font-size: 12px; color: var(--cream); }
.team.fire { background: var(--red); } .team.black { background: #3A3340; } .team.pig { background: var(--pink); color: var(--ink); }
.rrow .num { text-align: right; font-size: 19px; }
.up { color: var(--good); } .down { color: #C2343E; }
.rrow.mine .up { color: #8FE0AE; } .rrow.mine .down { color: #FFB3B3; } .rrow.mine .num:last-child { color: var(--gold); }
.resnote { margin: 4px 4px 0; font-size: 13px; font-weight: 700; color: var(--mute); }
.resnote b { color: var(--ink); }
.resfoot { margin-top: auto; display: grid; gap: 14px; color: var(--cream); }
.countdown { display: grid; justify-items: center; gap: 2px; }
.countdown .n { font: 400 64px/1 var(--font-display); color: var(--gold); }
.countdown .t { font-size: 14px; font-weight: 700; color: var(--lilac); }
.resfoot .bar { display: flex; gap: 10px; }
.resfoot .bar .gold { flex: 1; }
.final { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
