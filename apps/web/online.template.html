<title>사사끼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 군용 담요 위의 카드판 — 위·좌·우 상대 자리, 가운데 더미, 아래 내 주패. 오른쪽(모바일은 아래)에 진행 기록.
   Deliberately single-theme: 담요 판은 밝은 화면에서도 같은 어두운 녹색으로 보인다. */
:root {
  color-scheme: dark;
  --blanket: #1e3628;
  --blanket-hi: #2a4a37;
  --line: #3d6049;
  --ink: #efe9da;
  --muted: #a7b7a6;
  --card: #f6f0e1;
  --card-ink: #1f1d1a;
  --red: #b8312a;
  --egg: #e2b44c;
  --spec: #ea8a3c;
  --good: #8fcf8a;
  --shadow: rgba(5, 14, 9, .55);
  --font-display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, monospace;
  --r: 8px;
}
html, body { height: 100%; }
body {
  background-color: var(--blanket);
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 6px);
  color: var(--ink);
  font: 15px/1.5 var(--font-body);
}
#app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--egg); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.logo { font-family: var(--font-display); font-size: 30px; letter-spacing: .02em; color: var(--egg); line-height: 1; }
.sub { color: var(--muted); font-size: 13px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }
.meta > span { padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; font-variant-numeric: tabular-nums; }
.buried { display: inline-flex; align-items: center; gap: 3px; }
.buried i { width: 9px; height: 9px; border-radius: 50%; background: var(--egg); box-shadow: inset -2px -2px 0 rgba(0,0,0,.25); }
.buried em { font-style: normal; font-family: var(--font-num); color: var(--egg); margin-left: 3px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.tablearea { display: grid; gap: 12px; min-width: 0; }
.felt {
  display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr) minmax(0, 1fr);
  grid-template-areas: ". top ." "left pile right" ". bottom .";
  background: radial-gradient(ellipse at center, var(--blanket-hi), transparent 72%);
  border: 1px solid var(--line); border-radius: 18px; padding: 14px;
  box-shadow: inset 0 0 40px var(--shadow);
}
.seat { grid-area: auto; display: grid; gap: 4px; justify-items: center; text-align: center; padding: 8px 6px; border-radius: var(--r); border: 1px solid transparent; background: rgba(0,0,0,.14); min-width: 0; }
.seat.top { grid-area: top; } .seat.left { grid-area: left; align-self: center; } .seat.right { grid-area: right; align-self: center; } .seat.bottom { grid-area: bottom; }
.seat.viewing { border-color: var(--egg); }
.seat:hover { background: rgba(0,0,0,.24); }
.sname { font-weight: 700; font-size: 15px; }
.seggs { color: var(--muted); font-size: 12px; } .seggs b { color: var(--egg); font-family: var(--font-num); }
.backs { display: flex; justify-content: center; min-height: 18px; }
.back { width: 10px; height: 16px; margin-left: -4px; border-radius: 2px; background: repeating-linear-gradient(135deg, #7a2a24 0 3px, #5d1f1b 3px 6px); border: 1px solid #c9b48a; }
.back:first-child { margin-left: 0; }
.badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.chip { font-style: normal; font-size: 11px; line-height: 1; padding: 4px 7px; border-radius: 999px; background: rgba(239,233,218,.12); white-space: nowrap; }
.chip.turn { background: var(--egg); color: var(--card-ink); font-weight: 700; }
.chip.done { background: var(--good); color: var(--card-ink); }
.chip.warn { background: rgba(234,138,60,.25); color: var(--spec); }
.chip.firechip { background: var(--red); color: #fff; }
.chip.spec { background: var(--spec); color: var(--card-ink); font-weight: 700; }

.pile { grid-area: pile; min-height: 190px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; padding: 10px; min-width: 0; }
.pile-note { color: var(--muted); text-align: center; margin: 0; } .pile-note b { color: var(--ink); }
.play { display: grid; gap: 4px; justify-items: center; opacity: .6; }
.play.last { opacity: 1; }
.pcards { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; }
.pby { font-size: 12px; color: var(--muted); }
.play.last .pby { color: var(--ink); }

.card {
  --w: 46px;
  width: var(--w); height: calc(var(--w) * 1.42); flex: none;
  display: inline-grid; grid-template-rows: auto 1fr; justify-items: start; padding: 4px 5px;
  background: var(--card); color: var(--card-ink); border: 1px solid #d6cbb0; border-radius: 6px;
  box-shadow: 0 2px 0 rgba(0,0,0,.25); font-family: var(--font-num); line-height: 1;
  transition: transform .12s ease;
}
.card.red { color: var(--red); }
.card .rk { font-size: 17px; font-weight: 500; letter-spacing: -.02em; }
.card .st { font-size: 20px; align-self: end; justify-self: end; }
.card.small { --w: 34px; } .card.small .rk { font-size: 13px; } .card.small .st { font-size: 14px; }
.card.fire { border-color: var(--red); }
button.card:hover { transform: translateY(-3px); }
.card.sel { transform: translateY(-12px); box-shadow: 0 0 0 3px var(--egg), 0 6px 10px var(--shadow); }
button.card.sel:hover { transform: translateY(-12px); }

.viewbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.vlabel { color: var(--muted); font-size: 13px; margin-right: 2px; }
.tab { position: relative; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 14px; }
.tab.on { background: var(--ink); color: var(--card-ink); border-color: var(--ink); font-weight: 700; }
.tab .dot { position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--spec); border: 2px solid var(--blanket); }
.follow { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }

.me { display: grid; gap: 10px; padding: 12px; border-radius: 14px; background: rgba(0,0,0,.2); border: 1px solid var(--line); min-width: 0; }
.me-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.me-name { font-weight: 700; } .me-name small { color: var(--muted); font-weight: 400; margin-left: 4px; }
.status { font-size: 13px; color: var(--muted); } .status.good { color: var(--good); font-weight: 700; }
.status.none { color: var(--spec); font-weight: 700; }
.hand { display: flex; flex-wrap: wrap; gap: 5px; padding-top: 14px; min-height: 84px; }
.hand .card { --w: 50px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { padding: 9px 16px; border-radius: var(--r); border: 1px solid var(--line); background: rgba(239,233,218,.08); font-weight: 500; }
.btn:hover:not(:disabled) { background: rgba(239,233,218,.16); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--egg); color: var(--card-ink); border-color: var(--egg); font-weight: 700; min-width: 96px; }
.btn.primary:hover:not(:disabled) { background: #edc566; }
.btn.hot { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }
.btn.spec { background: var(--spec); border-color: var(--spec); color: var(--card-ink); font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 10px; font-size: 13px; }

.nopass { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; background: var(--spec); color: var(--card-ink); box-shadow: 0 6px 18px var(--shadow); }
.nopass-text { display: grid; gap: 2px; }
.nopass-text b { font-family: var(--font-display); font-weight: 400; font-size: clamp(22px, 5vw, 30px); line-height: 1.1; }
.nopass-text small { font-size: 13px; }
.clock { width: 52px; height: 52px; flex: none; }
.clock .face { fill: var(--card); stroke: var(--card-ink); stroke-width: 2.5; }
.clock .sweep { fill: none; stroke: var(--red); stroke-width: 6; stroke-dasharray: 100; stroke-dashoffset: 100; transform: rotate(-90deg); transform-origin: 24px 24px; animation: sweep linear forwards; }
.clock .hand { stroke: var(--card-ink); stroke-width: 3; stroke-linecap: round; transform-origin: 24px 24px; animation: tickhand steps(4, end) forwards; }
.clock .pin { fill: var(--card-ink); }
@keyframes sweep { to { stroke-dashoffset: 0; } }
@keyframes tickhand { to { transform: rotate(360deg); } }
.nopass { animation: wobble .5s ease-in-out infinite alternate; }
@keyframes wobble { from { transform: rotate(-.6deg); } to { transform: rotate(.6deg); } }
.panel { display: grid; gap: 10px; justify-items: center; text-align: center; max-width: 440px; }
.ptitle { font-family: var(--font-display); font-size: 26px; margin: 0; color: var(--egg); text-wrap: balance; }
.psub { margin: 0; color: var(--muted); font-size: 13px; text-wrap: pretty; } .psub b { color: var(--ink); }
.prow { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

.log { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 40px); overflow: auto; padding: 12px 14px; border-radius: 14px; background: rgba(0,0,0,.2); border: 1px solid var(--line); min-width: 0; }
.log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13px; }
.log li { color: var(--muted); } .log li:first-child { color: var(--ink); }
.eyebrow { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; color: var(--muted); }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(6, 14, 9, .72); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow: auto; }
.sheet { width: min(520px, 100%); display: grid; gap: 12px; padding: 20px; border-radius: 16px; background: var(--blanket); border: 1px solid var(--line); box-shadow: 0 20px 50px var(--shadow); }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; color: var(--egg); text-wrap: balance; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 7px 6px; text-align: left; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 500; }
td.num, th:nth-child(4), th:nth-child(5) { text-align: right; }
.up { color: var(--good); } .down { color: #f08a80; }
.final { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 4px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field input { padding: 8px 10px; border-radius: var(--r); border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--ink); font: inherit; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); z-index: 30; padding: 10px 16px; border-radius: 999px; background: var(--card); color: var(--card-ink); font-weight: 500; box-shadow: 0 6px 20px var(--shadow); max-width: calc(100% - 32px); }

#shout { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; pointer-events: none; font-family: var(--font-display); font-size: clamp(56px, 14vw, 130px); color: var(--egg); text-shadow: 0 4px 0 var(--red), 0 10px 30px var(--shadow); opacity: 0; }
#shout.on { animation: shout 1.1s ease-out; }
@keyframes shout { 0% { opacity: 0; transform: scale(.6) rotate(-6deg); } 18% { opacity: 1; transform: scale(1.08) rotate(-3deg); } 70% { opacity: 1; transform: scale(1) rotate(-3deg); } 100% { opacity: 0; transform: scale(1.02) rotate(-3deg); } }
@media (prefers-reduced-motion: reduce) {
  #shout.on { animation: fade 1s linear; } @keyframes fade { 0%, 100% { opacity: 0; } 20%, 70% { opacity: 1; } }
  .card, button.card:hover { transition: none; }
  .nopass { animation: none; }
}

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .log { position: static; max-height: 260px; }
}
/* 세로 휴대폰: 자리 배치는 컴퓨터와 똑같이 위·왼쪽·오른쪽·아래를 유지하고 크기만 줄인다 */
@media (max-width: 600px) {
  .felt { grid-template-columns: minmax(0, 1fr) minmax(0, 1.55fr) minmax(0, 1fr); grid-template-areas: ". top ." "left pile right" ". bottom ."; padding: 8px; gap: 6px; border-radius: 14px; }
  .seat { padding: 6px 4px; gap: 3px; }
  .seat .backs { display: none; }
  .sname { font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seggs { font-size: 11px; }
  .chip { font-size: 10px; padding: 3px 5px; }
  .pile { min-height: 150px; padding: 4px; }
  .pile .card { --w: 27px; } .pile .play.last .card { --w: 33px; }
  .pile .card .rk { font-size: 11px; } .pile .card .st { font-size: 12px; }
  .pile .play.last .card .rk { font-size: 13px; } .pile .play.last .card .st { font-size: 14px; }
  .pby { font-size: 11px; }
  .lead-note { font-size: 18px; }
  .ptitle { font-size: 20px; }
  .hand .card { --w: 40px; } .card .rk { font-size: 15px; } .card .st { font-size: 17px; }
  .logo { font-size: 26px; } .sub { display: none; }
  .me { padding: 10px; }
}
/* 가로 휴대폰(화면 높이가 낮을 때): 게임판과 내 주패를 나란히 */
@media (orientation: landscape) and (max-height: 520px) {
  #app { padding-block: 6px 10px; gap: 8px; }
  .top { gap: 6px; } .logo { font-size: 22px; } .sub { display: none; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .tablearea { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; gap: 10px; }
  .felt { padding: 6px; gap: 5px; }
  .seat { padding: 4px; gap: 2px; } .seat .backs { display: none; }
  .pile { min-height: 120px; padding: 4px; }
  .pile .card { --w: 28px; } .pile .play.last .card { --w: 34px; }
  .hand { padding-top: 10px; min-height: 0; }
  .hand .card { --w: 38px; }
  .log { max-height: 160px; }
}
/* 자리 상자: 내용 가운데 정렬, 위·아래 자리는 너무 넓어지지 않게 */
.seat { justify-items: center; text-align: center; }
.seat > * { justify-self: center; }
.sname { display: inline-flex; align-items: center; justify-content: center; gap: 2px; }
.seat.top, .seat.bottom { justify-self: center; width: min(100%, 280px); }
/* 차례 방향(반시계) 표시와 지금 차례인 자리 강조 */
.pile { position: relative; }
.pile::before { content: "↺"; position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(70px, 14vw, 130px); color: var(--ink); opacity: .06; pointer-events: none; }
.seat.active { border-color: var(--egg); box-shadow: 0 0 0 2px var(--egg), 0 0 18px rgba(226,180,76,.35); }
details.log > summary { cursor: pointer; list-style: none; }
details.log > summary::-webkit-details-marker { display: none; }
details.log > summary .eyebrow { margin: 0; }
details.log[open] > summary .eyebrow { margin-bottom: 8px; }
details.log > summary .eyebrow::after { content: " ▾"; }
details.log:not([open]) > summary .eyebrow::after { content: " ▸"; }

/* ── 온라인 전용 ── */
.home { min-height: 70vh; display: grid; place-items: center; }
.home-card { width: min(440px, 100%); display: grid; gap: 14px; padding: 24px; border-radius: 18px; background: rgba(0,0,0,.22); border: 1px solid var(--line); }
.home-card.wide { width: min(560px, 100%); }
.home-card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px; }
.logo.big { font-size: 56px; margin: 0; }
.fields1 { display: grid; gap: 12px; }
.code { font-family: var(--font-num); color: var(--egg); letter-spacing: .12em; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; } .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.join-row input, .invite input, .field.inline input { padding: 9px 10px; border-radius: var(--r); border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--ink); font: inherit; min-width: 0; }
.join-row input { width: 7em; text-transform: uppercase; font-family: var(--font-num); letter-spacing: .1em; }
.invite { display: flex; gap: 8px; } .invite input { flex: 1; font-size: 13px; }
.lseats { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.lseat { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--r); background: rgba(0,0,0,.2); border: 1px solid var(--line); font-weight: 500; min-width: 0; }
.lseat.empty { color: var(--muted); border-style: dashed; font-weight: 400; }
.lnum { font-family: var(--font-num); color: var(--muted); font-size: 12px; }
.lname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.aichip { background: #3d5f8a; color: #fff; }
.prow.left { justify-content: flex-start; align-items: end; }
.field.inline input { width: 6em; }
.ring { flex: none; vertical-align: middle; transform: rotate(-90deg); }
.ring.xs { width: 16px; height: 16px; } .ring.sm { width: 22px; height: 22px; margin-left: 6px; } .ring.md { width: 40px; height: 40px; }
.ring .bg { fill: none; stroke: rgba(239,233,218,.15); stroke-width: 5; }
.ring .fg { fill: none; stroke: var(--egg); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; animation: shrink linear forwards; }
@keyframes shrink { to { stroke-dashoffset: 100; } }
.pilewrap { display: grid; gap: 10px; justify-items: center; }
.pilecards { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; }
.play.special.last .pcards { filter: drop-shadow(0 0 10px rgba(234,138,60,.9)); }
.lead-note { margin: 0; font-family: var(--font-display); font-size: 22px; color: var(--egg); display: inline-flex; align-items: center; gap: 6px; }
.lead-note.quiet { font-family: var(--font-body); font-size: 13px; color: var(--muted); }
.timed { display: inline-flex; align-items: center; gap: 8px; padding: 4px 6px 4px 2px; border-radius: 12px; background: rgba(234,138,60,.18); }
.btn.big { font-size: 17px; padding: 11px 20px; }
#countdown.count { font-family: var(--font-display); font-size: 32px; color: var(--egg); }
tr.mine td { color: var(--egg); }
#shout { grid-auto-flow: row; gap: 4px; justify-items: center; align-content: center; }
#shout.on { animation-duration: var(--dur, 1.1s); }
#shout.face span { font-size: clamp(48px, 11vw, 104px); }
#shout .pigface { width: clamp(150px, 36vw, 260px); height: auto; filter: drop-shadow(0 10px 24px var(--shadow)); }
#shout.face.on { animation-name: pigpop; }
@keyframes pigpop { 0% { opacity: 0; transform: scale(.5); } 10% { opacity: 1; transform: scale(1.12); } 18% { transform: scale(1); } 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.04); } }
#shout.blackpig .pigface { animation: giggle .35s ease-in-out infinite alternate; }
@keyframes giggle { from { transform: rotate(-4deg) translateY(0); } to { transform: rotate(4deg) translateY(-6px); } }
#shout.blackpig span { color: #d9d9de; text-shadow: 0 4px 0 #111, 0 10px 30px var(--shadow); }
@media (prefers-reduced-motion: reduce) { #shout.face.on, #shout.blackpig .pigface { animation: fade var(--dur, 3s) linear; } }
@media (max-width: 520px) { .lseats { grid-template-columns: minmax(0, 1fr); } .logo.big { font-size: 46px; } }
</style>
